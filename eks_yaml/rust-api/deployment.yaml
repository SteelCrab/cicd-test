apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  labels:
    app: rust-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      serviceAccountName: rust-api-sa
      containers:
        - name: rust-api
          # 실제 계정 ID 적용됨
          image: __ACCOUNT_ID__.dkr.ecr.ap-southeast-1.amazonaws.com/rust-api:latest
          ports:
            - containerPort: 8080
          # ConfigMap 참조로 변경
          envFrom:
            - configMapRef:
                name: rust-api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
