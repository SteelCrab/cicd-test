name: fastapi-eks-argocd pipeline

on:
  push:
    branches: ["main", "ci/eks-fastapi"]
    paths:
      - "eks/fastapi/projects/fastapi/**"
      - "eks/fastapi/kubernetes/fastapi-app/**"
  pull_request:
    branches: ["main", "ci/eks-fastapi"]
    paths:
      - "eks/fastapi/projects/fastapi/**"
      - "eks/fastapi/kubernetes/fastapi-app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r eks/fastapi/projects/fastapi/requirements.txt
      - name: Lint with flake8
        run: |
          flake8 eks/fastapi/projects/fastapi --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 eks/fastapi/projects/fastapi --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          cd eks/fastapi/projects/fastapi && pytest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # 1. AWS 권한 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker 이미지 빌드 및 ECR 푸시
      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: "${{ secrets.ECR_REPOSITORY_FASTAPI_APP }}"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./eks/fastapi/projects/fastapi/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 4. ArgoCD CLI 설치
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      # 5. ArgoCD 로그인
      - name: ArgoCD Login
        run: |
          argocd login "${{ secrets.ARGOCD_SERVER }}" \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}" \
            --grpc-web \
            --insecure

      # 6. ArgoCD 이미지 태그 업데이트 및 Sync
      - name: Deploy via ArgoCD
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: "${{ secrets.ECR_REPOSITORY_FASTAPI_APP }}"
          IMAGE_TAG: ${{ github.sha }}
        run: |
          argocd app set fastapi-app \
            --kustomize-image "$ECR_REGISTRY/$ECR_REPOSITORY=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          argocd app sync fastapi-app

      # 7. 배포 완료 대기
      - name: Wait for deployment
        run: |
          argocd app wait fastapi-app --timeout 120
